<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asosiy Sahifa</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        #productContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 40px 20px;
        }

        .card1 {
            background-color: #161616;
            border: 1px solid #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            width: 250px;
            color: #fff;
            text-align: center;
        }

        .card-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .card-text {
            color: #10b981;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
        }

        #adminBtn {
            background-color: #10b981;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #adminBtn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <header>
        <img class="img1" src="./assets/Без названия.png" alt="Logo">
        <div class="nav-links">
            <h6><a class="txt1" href="#">BIZ HAQQIMIZDA</a></h6>
            <h6><a class="txt2" href="#">BIZ BILAN BOG'LANISH</a></h6>
            <h6><a class="txt3" href="#">SHIKOYAT</a></h6>
        </div>
        
        <div class="social-links">
            <p><a class="link1" href="https://www.instagram.com/_botir_kovka.uz?igsh=MXdlOTBoM2MzdnJjYQ%3D%3D">Instagram</a></p>
            <p><a class="link2" href="https://t.me/tkhrvf">Telegram</a></p>
        </div>

        <div class="header-right">
            <button id="darkBtn">Fon almashtirish</button>
            <button id="signInBtn">Sign in</button>
            <button id="signUpBtn">Sign up</button>
            <button id="logOutBtn" style="display: none;">Log out</button>
            <button id="adminBtn" onclick="window.location.href='admin-login.html'">Admin panel</button>
        </div>
    </header>

    <main id="productContainer">
    </main>

    <div id="signInModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Kirish (Sign In)</h2>
            <form id="signInForm">
                <label for="loginEmail">Gmail yoki Telefon raqam:</label>
                <input type="text" id="loginEmail" required placeholder="example@gmail.com yoki +998901234567">
                
                <label for="loginPassword">Parol:</label>
                <input type="password" id="loginPassword" required>
                
                <button type="submit">Kirish</button>
            </form>
        </div>
    </div>

    <div id="signUpModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ro'yxatdan o'tish (Sign Up)</h2>
            <form id="signUpForm">
                <label for="regEmail">Gmail:</label>
                <input type="email" id="regEmail" required placeholder="example@gmail.com">
                
                <label for="regPhone">Telefon raqam:</label>
                <input type="tel" id="regPhone" required placeholder="+998901234567">
                
                <label for="regPassword">Parol:</label>
                <input type="password" id="regPassword" required>
                
                <button type="submit">Ro'yxatdan o'tish</button>
            </form>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="./main.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('productContainer');
            
            // localStorage dan mahsulotlarni o'qiydi
            const products = JSON.parse(localStorage.getItem('adminProducts')) || [
                { id: 1, name: 'Darvoza', price: 'Kelishuv asosida', image: './img1.png' }
            ];

            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = `<p style="color: #888; text-align: center; width: 100%;">Hozircha mahsulotlar mavjud emas.</p>`;
            } else {
                products.forEach(product => {
                    const cardHTML = `
                        <div class="card1">
                            <img src="${product.image || './img1.png'}" class="card-img" alt="${product.name}">
                            <h3 class="card-title">${product.name}</h3>
                            <p style="color: #facc15; font-weight: bold;">${product.price}</p>
                            <a href="#" class="more-link">
                                <p class="card-text">Ko'proq</p>
                            </a>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });

                // Kartalar yaratilgandan keyin "Ko'proq" tugmasini tekshirish kodi
                const moreLinks = document.querySelectorAll('.more-link');
                moreLinks.forEach(link => {
                    link.addEventListener('click', (event) => {
                        event.preventDefault();
                        const isLogged = localStorage.getItem('isLoggedIn') === 'true';

                        if (!isLogged) {
                            alert("Iltimos, avval ro'yxatdan o'ting yoki tizimga kiring!");
                        } else {
                            console.log("Ruxsat berildi");
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
