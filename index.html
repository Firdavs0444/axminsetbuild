<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asosiy Sahifa</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <img class="img1" src="./assets/Без названия.png" alt="Logo">
        <nav class="nav-links">
            <a class="txt1" href="#">BIZ HAQQIMIZDA</a>
            <a class="txt2" href="#">BIZ BILAN BOG'LANISH</a>
            <a class="txt3" href="#">SHIKOYAT</a>
        </nav>
        
        <div class="social-links">
            <a class="link1" href="https://www.instagram.com/_botir_kovka.uz?igsh=MXdlOTBoM2MzdnJjYQ%3D%3D">Instagram</a>
            <a class="link2" href="https://t.me/tkhrvf">Telegram</a>
        </div>

        <div class="header-right">
            <button id="darkBtn">Fon almashtirish</button>
            <button id="signInBtn">Sign in</button>
            <button id="signUpBtn">Sign up</button>
            <button id="logOutBtn" style="display: none;">Log out</button>
            <button id="adminBtn" onclick="window.location.href='admin-login.html'">Admin panel</button>
        </div>
    </header>

    <!-- Main faqat bitta toza konteyner bo'lib qoldi -->
    <main id="productContainer">
    </main>

    <!-- Sign In Modal -->
    <div id="signInModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Kirish (Sign In)</h2>
            <form id="signInForm">
                <label for="loginEmail">Gmail yoki Telefon raqam:</label>
                <input type="text" id="loginEmail" required placeholder="example@gmail.com yoki +998901234567">
                
                <label for="loginPassword">Parol:</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
                
                <button type="submit">Kirish</button>
            </form>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div id="signUpModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ro'yxatdan o'tish (Sign Up)</h2>
            <form id="signUpForm">
                <label for="regEmail">Gmail:</label>
                <input type="email" id="regEmail" required placeholder="example@gmail.com">
                
                <label for="regPhone">Telefon raqam:</label>
                <input type="tel" id="regPhone" required placeholder="+998901234567">
                
                <label for="regPassword">Parol:</label>
                <input type="password" id="regPassword" required placeholder="••••••••">
                
                <button type="submit">Ro'yxatdan o'tish</button>
            </form>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="./main.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('productContainer');
            
            // localStorage dan mahsulotlarni olish
            const products = JSON.parse(localStorage.getItem('adminProducts')) || [
                { id: 1, name: 'Darvoza', price: 'Kelishuv asosida', image: './img1.png' }
            ];

            container.innerHTML = '';

            if (products.length === 0) {
                container.innerHTML = `<p style="color: #888; text-align: center; width: 100%; grid-column: 1/-1; font-size: 18px;">Hozircha mahsulotlar mavjud emas.</p>`;
            } else {
                // Har bir kartaga tartib bilan chiqishi uchun style="animation-delay" qo'shildi
                products.forEach((product, index) => {
                    const cardHTML = `
                        <div class="card1" style="animation-delay: ${index * 0.08}s;">
                            <div class="card-img-wrapper">
                                <img src="${product.image || './img1.png'}" class="card-img" alt="${product.name}">
                            </div>
                            <div class="card-info">
                                <h3 class="card-title">${product.name}</h3>
                                <p class="card-price">${product.price}</p>
                                <a href="#" class="more-link">
                                    <span class="card-text">Ko'proq</span>
                                </a>
                            </div>
                        </div>
                    `;
                    container.insertAdjacentHTML('beforeend', cardHTML);
                });
            }

            // ENGI VA TO'G'RI USUL: "Ko'proq" tugmasini event delegation orqali tekshirish
            container.addEventListener('click', (event) => {
                const targetLink = event.target.closest('.more-link');
                if (targetLink) {
                    event.preventDefault();
                    const isLogged = localStorage.getItem('isLoggedIn') === 'true';

                    if (!isLogged) {
                        alert("Iltimos, avval ro'yxatdan o'ting yoki tizimga kiring!");
                    } else {
                        console.log("Ruxsat berildi. Mahsulot tafsilotlari.");
                        // Bu yerga mahsulot sahifasiga o'tish kodini yozishingiz mumkin
                    }
                }
            });
        });
    </script>
</body>
</html>
