<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asosiy Sahifa</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <img class="img1" src="./assets/Без названия.png" alt="Logo">
        <nav class="nav-links">
            <a class="txt1" href="#">BIZ HAQQIMIZDA</a>
            <a class="txt2" href="#">BIZ BILAN BOG'LANISH</a>
            <a class="txt3" href="#">SHIKOYAT</a>
        </nav>
        
        <div class="social-links">
            <a class="link1" href="https://www.instagram.com/_botir_kovka.uz?igsh=MXdlOTBoM2MzdnJjYQ%3D%3D">Instagram</a>
            <a class="link2" href="https://t.me/tkhrvf">Telegram</a>
        </div>

        <div class="header-right">
            <button id="darkBtn">Fon almashtirish</button>
            <button id="signInBtn">Sign in</button>
            <button id="signUpBtn">Sign up</button>
            <button id="logOutBtn" style="display: none;">Log out</button>
            <button id="adminBtn" onclick="window.location.href='admin-login.html'">Admin panel</button>
        </div>
    </header>

    <div class="category-slider">
        <button class="cat-btn active">Barchasi</button>
        <button class="cat-btn">Darvozalar</button>
        <button class="cat-btn">Panjaralar</button>
        <button class="cat-btn">Naveslar</button>
        <button class="cat-btn">Zinapoyalar</button>
    </div>

    <main id="productContainer">
        </main>

    <div id="signInModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Kirish (Sign In)</h2>
            <form id="signInForm">
                <label for="loginEmail">Gmail yoki Telefon raqam:</label>
                <input type="text" id="loginEmail" required placeholder="example@gmail.com yoki +998901234567">
                
                <label for="loginPassword">Parol:</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
                
                <button type="submit">Kirish</button>
            </form>
        </div>
    </div>

    <div id="signUpModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ro'yxatdan o'tish (Sign Up)</h2>
            <form id="signUpForm">
                <label for="regEmail">Gmail:</label>
                <input type="email" id="regEmail" required placeholder="example@gmail.com">
                
                <label for="regPhone">Telefon raqam:</label>
                <input type="tel" id="regPhone" required placeholder="+998901234567">
                
                <label for="regPassword">Parol:</label>
                <input type="password" id="regPassword" required placeholder="••••••••">
                
                <button type="submit">Ro'yxatdan o'tish</button>
            </form>
        </div>
    </div>

    <div id="imageLightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImg" src="" alt="Kattalashtirilgan rasm">
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
