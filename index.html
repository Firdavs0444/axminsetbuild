    <div id="signInModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Kirish (Sign In)</h2>
            <form id="signInForm">
                <label for="loginEmail">Gmail yoki Telefon raqam:</label>
                <input type="text" id="loginEmail" required placeholder="example@gmail.com yoki +998901234567">
                
                <label for="loginPassword">Parol:</label>
                <input type="password" id="loginPassword" required>
                
                <button type="submit">Kirish</button>
            </form>
        </div>
    </div>

    <div id="signUpModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ro'yxatdan o'tish (Sign Up)</h2>
            <form id="signUpForm">
                <label for="regEmail">Gmail:</label>
                <input type="email" id="regEmail" required placeholder="example@gmail.com">
                
                <label for="regPhone">Telefon raqam:</label>
                <input type="tel" id="regPhone" required placeholder="+998901234567">
                
                <label for="regPassword">Parol:</label>
                <input type="password" id="regPassword" required>
                
                <button type="submit">Ro'yxatdan o'tish</button>
            </form>
        </div>
    </div>
